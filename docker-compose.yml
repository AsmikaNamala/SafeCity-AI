version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: safecity-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-safecity_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-safecity_password}
      POSTGRES_DB: ${DATABASE_NAME:-safecity_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - safecity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-safecity_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: safecity-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - safecity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safecity-backend
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-safecity_user}:${DATABASE_PASSWORD:-safecity_password}@postgres:5432/${DATABASE_NAME:-safecity_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key}
      DEBUG: ${DEBUG:-False}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - safecity-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safecity-frontend
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_WEBSOCKET_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - safecity-network
    command: npm start

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  safecity-network:
    driver: bridge